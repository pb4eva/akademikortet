<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="./leaflet.css" />
      .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(90%);
    }
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      touch-action: none;
      overscroll-behavior: none;
      background: #141416;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      color: #fff;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #1c1c1e;
    }

    /* Apple Liquid Glass Material */
    .liquid-glass {
      background: linear-gradient(180deg, rgba(45, 45, 52, 0.58) 0%, rgba(20, 20, 25, 0.76) 100%);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        inset 0 -1px 0 rgba(255, 255, 255, 0.08);
    }

    /* Floating Bottom Dock */
    .bottom-bar {
      position: fixed;
      left: calc(12px + env(safe-area-inset-left));
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(12px + env(safe-area-inset-bottom));
      height: 54px;
      border-radius: 27px;
      display: flex;
      gap: 8px;
      padding: 6px;
      box-sizing: border-box;
      align-items: center;
      z-index: 10;
    }

    .search-box {
      flex: 1;
      height: 40px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
      border-radius: 20px;
      color: #fff;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      -webkit-appearance: none;
    }
    .search-box::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    .layers-btn {
      height: 40px;
      background: linear-gradient(180deg, rgba(45, 160, 255, 0.82) 0%, rgba(10, 115, 240, 0.92) 100%);
      border: 1px solid rgba(255, 255, 255, 0.38);
      box-shadow:
        0 4px 12px rgba(10, 132, 255, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
      color: #fff;
      border-radius: 20px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Floating Glass Drawers */
    .drawer {
      position: fixed;
      left: calc(12px + env(safe-area-inset-left));
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(74px + env(safe-area-inset-bottom));
      max-height: 46vh;
      border-radius: 24px;
      padding: 6px 14px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      z-index: 20;
      display: none;
    }
    .drawer.open {
      display: block;
    }

    .drawer-item {
      padding: 12px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      cursor: pointer;
    }
    .drawer-item:last-child {
      border-bottom: none;
    }
    .layer-label {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .color-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
    }
    .pin-sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
      margin-top: 2px;
    }

    /* Custom Liquid Glass Pin Popups */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: rgba(30, 30, 36, 0.78) !important;
      backdrop-filter: blur(20px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
      color: #fff !important;
      border: 1px solid rgba(255, 255, 255, 0.24) !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35) !important;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 16px !important;
    }
    .leaflet-popup-close-button {
      color: rgba(255, 255, 255, 0.75) !important;
    }
    .leaflet-control-attribution {
      display: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="searchDrawer" class="drawer liquid-glass"></div>
  <div id="layerDrawer" class="drawer liquid-glass"></div>

  <div class="bottom-bar liquid-glass">
    <input id="searchInput" class="search-box" type="search" placeholder="Search pins..." autocomplete="off">
    <button id="layersBtn" class="layers-btn">Loading...</button>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
