<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; position: fixed; inset: 0;
      background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
    }
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    #map {
      width: 100%; height: 100%; border-radius: 20px; overflow: hidden; z-index: 1;
    }

    /* Shared Liquid Glass Material */
    .liquid-glass {
      background: linear-gradient(180deg, rgba(45, 45, 50, 0.55) 0%, rgba(22, 22, 26, 0.72) 100%);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        inset 0 -1px 0 rgba(255, 255, 255, 0.08);
    }

    /* Floating Bottom Dock */
    .bottom-bar {
      position: absolute;
      left: calc(12px + env(safe-area-inset-left));
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(12px + env(safe-area-inset-bottom));
      height: 54px;
      border-radius: 27px;
      display: flex;
      gap: 8px;
      padding: 6px;
      box-sizing: border-box;
      align-items: center;
      z-index: 10;
    }

    .search-box {
      flex: 1;
      height: 40px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
      border-radius: 20px;
      color: #fff;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
    }
    .search-box::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    .layers-btn {
      height: 40px;
      background: linear-gradient(180deg, rgba(40, 155, 255, 0.78) 0%, rgba(10, 115, 240, 0.88) 100%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow:
        0 4px 12px rgba(10, 132, 255, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
      color: #fff;
      border-radius: 20px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Floating Glass Drawers */
    .drawer {
      position: absolute;
      left: calc(12px + env(safe-area-inset-left));
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(74px + env(safe-area-inset-bottom));
      max-height: 45vh;
      border-radius: 24px;
      padding: 8px 14px;
      overflow-y: auto;
      z-index: 20;
      display: none;
    }
    .drawer.open { display: block; }

    .drawer-item {
      padding: 11px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .drawer-item:last-child { border-bottom: none; }
    .pin-sub { font-size: 11px; color: rgba(255, 255, 255, 0.65); margin-top: 2px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="searchDrawer" class="drawer liquid-glass"></div>
  <div id="layerDrawer" class="drawer liquid-glass"></div>

  <div class="bottom-bar liquid-glass">
    <input id="searchInput" class="search-box" type="search" placeholder="Search pins..." autocomplete="off">
    <button class="layers-btn" onclick="toggleLayers()">Layers (10)</button>
  </div>

  <script>
    const map = L.map('map', { zoomControl: false }).setView([55.6761, 12.5683], 12);
    L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const allPins = [];
    const layerGroups = {};

    fetch('map.kml')
      .then(res => res.text())
      .then(kmlText => {
        const parser = new DOMParser();
        const kml = parser.parseFromString(kmlText, 'text/xml');
        const folders = kml.querySelectorAll('Folder');
        const bounds = L.latLngBounds();

        folders.forEach((folder, idx) => {
          const nameEl = folder.querySelector(':scope > name');
          const layerName = nameEl ? nameEl.textContent.trim() : `Layer ${idx + 1}`;
          const geojson = toGeoJSON.kml(folder);
          const group = L.layerGroup().addTo(map);
          layerGroups[layerName] = group;

          L.geoJSON(geojson, {
            onEachFeature: (feature, layer) => {
              const title = feature.properties.name || 'Unnamed Pin';
              const desc = feature.properties.description || '';
              layer.bindPopup(`<b>${title}</b><br><small>${layerName}</small><br>${desc}`);
              layer.addTo(group);

              if (layer.getLatLng) {
                const ll = layer.getLatLng();
                bounds.extend(ll);
                allPins.push({ title, desc, layerName, latlng: ll, marker: layer, group });
              }
            }
          });
        });

        if (bounds.isValid()) map.fitBounds(bounds, { padding: [30, 30] });
        document.querySelector('.layers-btn').textContent = `Layers (${Object.keys(layerGroups).length})`;
        buildLayerDrawer();
      });

    function buildLayerDrawer() {
      const drawer = document.getElementById('layerDrawer');
      drawer.innerHTML = Object.keys(layerGroups).map(name => `
        <label class="drawer-item">
          <span>${name}</span>
          <input type="checkbox" checked onchange="toggleSingleLayer('${name.replace(/'/g, "\\'")}', this.checked)">
        </label>
      `).join('');
    }

    function toggleSingleLayer(name, visible) {
      if (visible) map.addLayer(layerGroups[name]);
      else map.removeLayer(layerGroups[name]);
    }

    function toggleLayers() {
      document.getElementById('searchDrawer').classList.remove('open');
      document.getElementById('layerDrawer').classList.toggle('open');
    }

    const searchInput = document.getElementById('searchInput');
    const searchDrawer = document.getElementById('searchDrawer');

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase().trim();
      document.getElementById('layerDrawer').classList.remove('open');
      if (!q) { searchDrawer.classList.remove('open'); return; }

      const matches = allPins.filter(p =>
        p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q)
      ).slice(0, 20);

      searchDrawer.innerHTML = matches.length ? matches.map(p => `
        <div class="drawer-item" style="flex-direction:column;align-items:flex-start" onclick="goToPin(${allPins.indexOf(p)})">
          <div>${p.title}</div>
          <div class="pin-sub">${p.layerName}</div>
        </div>
      `).join('') : '<div class="drawer-item">No matching pins</div>';
      searchDrawer.classList.add('open');
    });

    function goToPin(index) {
      const p = allPins[index];
      if (!map.hasLayer(p.group)) map.addLayer(p.group);
      map.flyTo(p.latlng, 16);
      p.marker.openPopup();
      searchDrawer.classList.remove('open');
      searchInput.blur();
    }
  </script>
</body>
</html>
