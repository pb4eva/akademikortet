<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      background: #000;
    }
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 16px;
      display: block;
    }
  </style>
</head>
<body>
  <iframe src="https://www.google.com/maps/d/embed?mid=15IvpuMVFtmDBCOigwxhhqgYJXbakdbU&usp=drive_link
    "></iframe>
</body>
</html>
