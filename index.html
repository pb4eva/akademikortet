<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      touch-action: none;
      overscroll-behavior: none;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      color: #fff;
    }
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    #map {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      z-index: 1;
    }

    /* Shared Apple Liquid Glass Material */
    .liquid-glass {
      background: linear-gradient(180deg, rgba(45, 45, 52, 0.58) 0%, rgba(20, 20, 25, 0.76) 100%);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        inset 0 -1px 0 rgba(255, 255, 255, 0.08);
    }

    /* Floating Bottom Dock */
    .bottom-bar {
      position: absolute;
      left: calc(12px + env(safe-area-inset-left));
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(12px + env(safe-area-inset-bottom));
      height: 54px;
      border-radius: 27px;
      display: flex;
      gap: 8px;
      padding: 6px;
      box-sizing: border-box;
      align-items: center;
      z-index: 10;
    }

    .search-box {
      flex: 1;
      height: 40px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
      border-radius: 20px;
      color: #fff;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      -webkit-appearance: none;
    }
    .search-box::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    .layers-btn {
      height: 40px;
      background: linear-gradient(180deg, rgba(45, 160, 255, 0.82) 0%, rgba(10, 115, 240, 0.92) 100%);
      border: 1px solid rgba(255, 255, 255, 0.38);
      box-shadow:
        0 4px 12px rgba(10, 132, 255, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
      color: #fff;
      border-radius: 20px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Floating Glass Drawers (Search Results & Layers) */
    .drawer {
      position: absolute;
      left: calc(12px + env(safe-area-inset-left));
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(74px + env(safe-area-inset-bottom));
      max-height: 46vh;
      border-radius: 24px;
      padding: 6px 14px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      z-index: 20;
      display: none;
    }
    .drawer.open {
      display: block;
    }

    .drawer-item {
      padding: 12px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      cursor: pointer;
    }
    .drawer-item:last-child {
      border-bottom: none;
    }
    .layer-label {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .color-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
    }
    .pin-sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
      margin-top: 2px;
    }

    /* Custom Liquid Glass Pin Popups */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: rgba(30, 30, 36, 0.78) !important;
      backdrop-filter: blur(20px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
      color: #fff !important;
      border: 1px solid rgba(255, 255, 255, 0.24) !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35) !important;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 16px !important;
    }
    .leaflet-popup-close-button {
      color: rgba(255, 255, 255, 0.75) !important;
    }
    .leaflet-control-attribution {
      display: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="searchDrawer" class="drawer liquid-glass"></div>
  <div id="layerDrawer" class="drawer liquid-glass"></div>

  <div class="bottom-bar liquid-glass">
    <input id="searchInput" class="search-box" type="search" placeholder="Search pins..." autocomplete="off">
    <button id="layersBtn" class="layers-btn" onclick="toggleLayers()">Layers</button>
  </div>

  <script>
    const map = L.map('map', { zoomControl: false }).setView([55.6761, 12.5683], 12);
    L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png').addTo(map);

    const palette = ['#0a84ff', '#30d158', '#ff9f0a', '#ff375f', '#bf5af2', '#64d2ff', '#ffd60a', '#ff453a', '#5e5ce6', '#32ade6'];
    const allPins = [];
    const layerGroups = {};
    const layerColors = {};

    fetch('map.kml')
      .then(res => res.text())
      .then(kmlText => {
        const parser = new DOMParser();
        const kml = parser.parseFromString(kmlText, 'text/xml');
        const folders = kml.querySelectorAll('Folder');
        const bounds = L.latLngBounds();

        folders.forEach((folder, idx) => {
          const nameEl = folder.querySelector(':scope > name');
          const layerName = nameEl ? nameEl.textContent.trim() : `Layer ${idx + 1}`;
          const color = palette[idx % palette.length];
          const geojson = toGeoJSON.kml(folder);
          const group = L.layerGroup().addTo(map);

          layerGroups[layerName] = group;
          layerColors[layerName] = color;

          L.geoJSON(geojson, {
            pointToLayer: (feature, latlng) => {
              return L.circleMarker(latlng, {
                radius: 8,
                fillColor: color,
                color: '#ffffff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.92
              });
            },
            style: () => ({ color: color, weight: 3, opacity: 0.85 }),
            onEachFeature: (feature, layer) => {
              const title = feature.properties.name || 'Unnamed Pin';
              const desc = feature.properties.description || '';
              layer.bindPopup(`<div style="font-size:14px;font-weight:600;margin-bottom:2px;">${title}</div><div style="font-size:11px;color:#8e8e93;margin-bottom:4px;">${layerName}</div><div style="font-size:13px;line-height:1.35;">${desc}</div>`);
              layer.addTo(group);

              if (layer.getLatLng) {
                const ll = layer.getLatLng();
                bounds.extend(ll);
                allPins.push({ title, desc, layerName, latlng: ll, marker: layer, group });
              }
            }
          });
        });

        if (bounds.isValid()) {
          map.fitBounds(bounds, { padding: [30, 30] });
        }
        document.getElementById('layersBtn').textContent = `Layers (${Object.keys(layerGroups).length})`;
        buildLayerDrawer();
      });

    function buildLayerDrawer() {
      const drawer = document.getElementById('layerDrawer');
      drawer.innerHTML = Object.keys(layerGroups).map(name => `
        <label class="drawer-item">
          <span class="layer-label">
            <span class="color-dot" style="background:${layerColors[name]}"></span>
            <span>${name}</span>
          </span>
          <input type="checkbox" checked onchange="toggleSingleLayer('${name.replace(/'/g, "\\'")}', this.checked)">
        </label>
      `).join('');
    }

    function toggleSingleLayer(name, visible) {
      if (visible) map.addLayer(layerGroups[name]);
      else map.removeLayer(layerGroups[name]);
    }

    function toggleLayers() {
      document.getElementById('searchDrawer').classList.remove('open');
      document.getElementById('layerDrawer').classList.toggle('open');
    }

    const searchInput = document.getElementById('searchInput');
    const searchDrawer = document.getElementById('searchDrawer');

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase().trim();
      document.getElementById('layerDrawer').classList.remove('open');
      if (!q) {
        searchDrawer.classList.remove('open');
        return;
      }

      const matches = allPins.filter(p =>
        p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q)
      ).slice(0, 25);

      searchDrawer.innerHTML = matches.length ? matches.map(p => `
        <div class="drawer-item" style="flex-direction:column;align-items:flex-start" onclick="goToPin(${allPins.indexOf(p)})">
          <div>${p.title}</div>
          <div class="pin-sub">${p.layerName}</div>
        </div>
      `).join('') : '<div class="drawer-item">No matching pins</div>';
      searchDrawer.classList.add('open');
    });

    function goToPin(index) {
      const p = allPins[index];
      if (!map.hasLayer(p.group)) map.addLayer(p.group);
      map.flyTo(p.latlng, 16);
      p.marker.openPopup();
      searchDrawer.classList.remove('open');
      searchInput.blur();
    }

    // Close drawers when tapping the map
    map.on('click', () => {
      searchDrawer.classList.remove('open');
      document.getElementById('layerDrawer').classList.remove('open');
searchInput.blur();
});
// Lock outer page bounce while allowing drawer scrolling
document.addEventListener('touchmove', function(e) {
if (!e.target.closest('.drawer')) {
e.preventDefault();
}
}, { passive: false });
