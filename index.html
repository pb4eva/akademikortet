<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      touch-action: none;
      overscroll-behavior: none;
      background: #141416;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      color: #fff;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #1c1c1e;
    }

    /* Apple Liquid Glass Material */
    .liquid-glass {
      background: linear-gradient(180deg, rgba(45, 45, 52, 0.58) 0%, rgba(20, 20, 25, 0.76) 100%);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        inset 0 -1px 0 rgba(255, 255, 255, 0.08);
    }

    /* Floating Bottom Dock */
    .bottom-bar {
      position: fixed;
      left: calc(12px + env(safe-area-inset-left));
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(12px + env(safe-area-inset-bottom));
      height: 54px;
      border-radius: 27px;
      display: flex;
      gap: 8px;
      padding: 6px;
      box-sizing: border-box;
      align-items: center;
      z-index: 10;
    }

    .search-box {
      flex: 1;
      height: 40px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
      border-radius: 20px;
      color: #fff;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      -webkit-appearance: none;
    }
    .search-box::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    .layers-btn {
      height: 40px;
      background: linear-gradient(180deg, rgba(45, 160, 255, 0.82) 0%, rgba(10, 115, 240, 0.92) 100%);
      border: 1px solid rgba(255, 255, 255, 0.38);
      box-shadow:
        0 4px 12px rgba(10, 132, 255, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
      color: #fff;
      border-radius: 20px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Floating Glass Drawers */
    .drawer {
      position: fixed;
      left: calc(12px + env(safe-area-inset-left));
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(74px + env(safe-area-inset-bottom));
      max-height: 46vh;
      border-radius: 24px;
      padding: 6px 14px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      z-index: 20;
      display: none;
    }
    .drawer.open {
      display: block;
    }

    .drawer-item {
      padding: 12px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      cursor: pointer;
    }
    .drawer-item:last-child {
      border-bottom: none;
    }
    .layer-label {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .color-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
    }
    .pin-sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
      margin-top: 2px;
    }

    /* Custom Liquid Glass Pin Popups */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: rgba(30, 30, 36, 0.78) !important;
      backdrop-filter: blur(20px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
      color: #fff !important;
      border: 1px solid rgba(255, 255, 255, 0.24) !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35) !important;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 16px !important;
    }
    .leaflet-popup-close-button {
      color: rgba(255, 255, 255, 0.75) !important;
    }
    .leaflet-control-attribution {
      display: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="searchDrawer" class="drawer liquid-glass"></div>
  <div id="layerDrawer" class="drawer liquid-glass"></div>

  <div class="bottom-bar liquid-glass">
    <input id="searchInput" class="search-box" type="search" placeholder="Search pins..." autocomplete="off">
    <button id="layersBtn" class="layers-btn" onclick="toggleLayers()">Layers</button>
  </div>

  <script>
    // Build Leaflet URLs using simple string concatenation (no brackets to get stripped!)
    const baseCdn = 'https://' + '://unpkg.com';

    const cssLink = document.createElement('link');
    cssLink.rel = 'stylesheet';
    cssLink.href = baseCdn + '/leaflet.css';
    document.head.appendChild(cssLink);

    const jsScript = document.createElement('script');
    jsScript.src = baseCdn + '/leaflet.js';
    jsScript.onload = initApp;
    document.head.appendChild(jsScript);

    let map;
    const allPins = new Array();
    const layerGroups = {};
    const layerColors = {};

    function toggleLayers() {
      document.getElementById('searchDrawer').classList.remove('open');
      document.getElementById('layerDrawer').classList.toggle('open');
    }

    function toggleSingleLayer(name, visible) {
      if (!map) return;
      if (visible) map.addLayer(layerGroups[name]);
      else map.removeLayer(layerGroups[name]);
    }

    function goToPin(index) {
      const p = allPins.at(index);
      if (!p || !map) return;
      if (!map.hasLayer(p.group)) map.addLayer(p.group);
      map.flyTo(p.latlng, 16);
      p.marker.openPopup();
      document.getElementById('searchDrawer').classList.remove('open');
      document.getElementById('searchInput').blur();
    }

    function initApp() {
      map = L.map('map', { zoomControl: false }).setView([55.6761, 12.5683], 11);

      // Build CartoDB Dark Matter URL using string concatenation
      const tileUrl = 'https://' + '://cartocdn.com{z}/{x}/{y}.png';
      L.tileLayer(tileUrl, { maxZoom: 19 }).addTo(map);

      setTimeout(() => { map.invalidateSize(); }, 300);

      const palette = new Array('#0a84ff', '#30d158', '#ff9f0a', '#ff375f', '#bf5af2', '#64d2ff', '#ffd60a', '#ff453a', '#5e5ce6', '#32ade6');

      function parseCoords(coordText) {
        const result = new Array();
        const pairs = coordText.trim().split(/\s+/);
        for (let i = 0; i < pairs.length; i++) {
          const parts = pairs.at(i).split(',');
          if (parts.length >= 2) {
            const lng = parseFloat(parts.at(0));
            const lat = parseFloat(parts.at(1));
            if (!isNaN(lat) && !isNaN(lng)) {
              result.push(L.latLng(lat, lng));
            }
          }
        }
        return result;
      }

      fetch('map.kml?v=' + Date.now())
        .then(res => {
          if (!res.ok) throw new Error('Could not find map.kml');
          return res.text();
        })
        .then(kmlText => {
          const parser = new DOMParser();
          const kml = parser.parseFromString(kmlText, 'text/xml');
          let folders = Array.from(kml.getElementsByTagName('Folder'));
          if (folders.length === 0) folders = new Array(kml.documentElement);

          const bounds = L.latLngBounds();

          folders.forEach((folder, idx) => {
            const placemarks = Array.from(folder.getElementsByTagName('Placemark'));
            if (placemarks.length === 0) return;

            const nameNode = Array.from(folder.children).find(el => el.tagName === 'name');
            const layerName = nameNode ? nameNode.textContent.trim() : `Layer ${idx + 1}`;
            const color = palette.at(Object.keys(layerGroups).length % palette.length);
            const group = L.layerGroup().addTo(map);

            layerGroups[layerName] = group;
            layerColors[layerName] = color;

            placemarks.forEach(pm => {
              const titleNode = pm.getElementsByTagName('name').item(0);
              const descNode = pm.getElementsByTagName('description').item(0);
              const title = titleNode ? titleNode.textContent.trim() : 'Unnamed Pin';
              const desc = descNode ? descNode.textContent.trim() : '';

              const popupHtml = `
                <div style="font-size:14px;font-weight:600;margin-bottom:2px;">${title}</div>
                <div style="font-size:11px;color:#8e8e93;margin-bottom:4px;">${layerName}</div>
                <div style="font-size:13px;line-height:1.35;">${desc}</div>
              `;

              const pointNode = pm.getElementsByTagName('Point').item(0);
              const lineNode = pm.getElementsByTagName('LineString').item(0);
              const polyNode = pm.getElementsByTagName('Polygon').item(0);

              if (pointNode) {
                const coordNode = pointNode.getElementsByTagName('coordinates').item(0);
                if (coordNode) {
                  const coords = parseCoords(coordNode.textContent);
                  if (coords.length > 0) {
                    const ll = coords.at(0);
                    const marker = L.circleMarker(ll, {
                      radius: 8,
                      fillColor: color,
                      color: '#ffffff',
                      weight: 2,
                      opacity: 1,
                      fillOpacity: 0.92
                    }).bindPopup(popupHtml).addTo(group);

                    bounds.extend(ll);
                    allPins.push({ title, desc, layerName, latlng: ll, marker, group });
                  }
                }
} else if (lineNode) {
const coordNode = lineNode.getElementsByTagName('coordinates').item(0);
if (coordNode) {
const coords = parseCoords(coordNode.textContent);
if (coords.length > 0) {
const line = L.polyline(coords, { color: color, weight: 4, opacity: 0.85 }).bindPopup(popupHtml).addTo(group);
bounds.extend(line.getBounds());
allPins.push({ title, desc, layerName, latlng: line.getBounds().getCenter(), marker: line, group });
}
}
} else if (polyNode) {
const coordNode = polyNode.getElementsByTagName('coordinates').item(0);
if (coordNode) {
const coords = parseCoords(coordNode.textContent);
if (coords.length > 0) {
const poly = L.polygon(coords, { color: color, weight: 2, fillOpacity: 0.25 }).bindPopup(popupHtml).addTo(group);
bounds.extend(poly.getBounds());
allPins.push({ title, desc, layerName, latlng: poly.getBounds().getCenter(), marker: poly, group });
}
}
}
});
});
map.invalidateSize();
if (bounds.isValid()) {
map.fitBounds(bounds, { padding: L.point(40, 40) });
}
document.getElementById('layersBtn').textContent = Layers (${Object.keys(layerGroups).length});
buildLayerDrawer();
})
.catch(err => {
document.getElementById('layersBtn').textContent = 'No KML';
console.error(err);
});
function buildLayerDrawer() {
const drawer = document.getElementById('layerDrawer');
drawer.innerHTML = Object.keys(layerGroups).map(name => `
`).join('');
}
const searchInput = document.getElementById('searchInput');
const searchDrawer = document.getElementById('searchDrawer');
searchInput.addEventListener('input', () => {
const q = searchInput.value.toLowerCase().trim();
document.getElementById('layerDrawer').classList.remove('open');
if (!q) {
searchDrawer.classList.remove('open');
return;
}
const matches = allPins.filter(p =>
p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q)
).slice(0, 25);
searchDrawer.innerHTML = matches.length ? matches.map(p => <div class="drawer-item" style="flex-direction:column;align-items:flex-start" onclick="goToPin(${allPins.indexOf(p)})"> <div>${p.title}</div> <div class="pin-sub">${p.layerName}</div> </div>).join('') : 'No matching pins';
searchDrawer.classList.add('open');
});
map.on('click', () => {
searchDrawer.classList.remove('open');
document.getElementById('layerDrawer').classList.remove('open');
searchInput.blur();
});
}
document.addEventListener('touchmove', function(e) {
if (!e.target.closest('.drawer')) {
e.preventDefault();
}
}, { passive: false });
